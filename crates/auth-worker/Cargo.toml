[package]
name = "factory0-auth-worker"
description = "The deployable auth Worker: composes the auth modules into one harness venture (auth#41)"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
factory0-auth-core = { path = "../auth-core" }
factory0-auth-oidc = { path = "../auth-oidc" }
factory0-auth-passkeys = { path = "../auth-passkeys" }
factory0-auth-magic-link = { path = "../auth-magic-link" }
factory0-auth-password = { path = "../auth-password" }
factory0-auth-meta = { path = "../auth-meta" }
cratefield-core = { workspace = true }
cratefield-runtime-cloudflare = { workspace = true }
cratefield-adapter-resend = { workspace = true }
worker = { workspace = true }
async-trait = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true }
