[package]
name = "factory0-auth-oidc"
description = "OpenID Connect login for the Factory Zero auth service: Google first, shaped so any compliant provider reuses the flow (issue #15)"
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
factory0-core = { workspace = true }
# auth-core owns the schema and the account-linking rules; this module
# writes through its published API and adds no tables of its own.
factory0-auth-core = { path = "../auth-core" }
axum = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
base64ct = { workspace = true }
getrandom = { workspace = true }
url = { workspace = true }
openidconnect = { workspace = true }
chrono = { workspace = true }
# Apple's client secret is an ES256 JWT this module mints from a PKCS#8
# key, not a string an operator pastes (#16).
p256 = { workspace = true }

[dev-dependencies]
factory0-testing = { workspace = true }
factory0-adapter-sqlite = { workspace = true }
pollster = { workspace = true }
tower = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
rsa = { workspace = true }
rand = "0.8"
