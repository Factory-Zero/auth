name: deploy

# The deployable auth Worker (auth#41): `main` -> staging, a `v*` tag ->
# production behind the environment approval gate.
on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  staging:
    name: deploy staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Deploy (staging) + apply migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          preCommands: |
            cargo install -q worker-build
            npx wrangler d1 migrations apply DB --remote
      - name: Smoke staging
        run: ./smoke.sh "${{ vars.AUTH_STAGING_URL }}"

  production:
    name: deploy production
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production # the approval gate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Deploy (production) + apply migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production
          preCommands: |
            cargo install -q worker-build
            npx wrangler d1 migrations apply DB --env production --remote
      - name: Smoke production
        run: ./smoke.sh "https://auth.factory0.ventures"
