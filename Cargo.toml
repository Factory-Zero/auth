[workspace]
resolver = "3"
members = ["crates/*", "spikes/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/Factory-Zero/auth"

[workspace.dependencies]
askama = "0.14.0"
# Harness crates, pinned to a harness main commit (45c34a4, 2026-09-07).
# They are NOT on crates.io yet; when they publish, these git pins become
# version pins (issue #25).
#
# The repository moved to the Cratefield organisation. git follows the
# rename, but the address is written out here so a reader is not misled
# about where the code lives.
factory0-core = { git = "https://github.com/Cratefield/harness", rev = "45c34a4cc1ad8e2ed0c0077093590a424623f0bd" }
factory0-testing = { git = "https://github.com/Cratefield/harness", rev = "45c34a4cc1ad8e2ed0c0077093590a424623f0bd" }
factory0-adapter-sqlite = { git = "https://github.com/Cratefield/harness", rev = "45c34a4cc1ad8e2ed0c0077093590a424623f0bd" }

# Versions mirror the harness workspace so the git harness crates and our
# direct dependencies unify into one dependency tree.
# axum runs without tokio on Workers (harness ADR 0001): default features
# off, only the extractor features modules need are enabled.
axum = { version = "0.8.9", default-features = false, features = [
    "json",
    "query",
    "form",
    "matched-path",
] }
http = "1.5.0"
bytes = "1.12.1"

# Serialization and diagnostics.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Apple posts its authorization response as a form body (#16). axum parses
# one with this crate; the module parses it directly so a malformed body
# gets the module's own answer rather than axum's rejection text.
serde_urlencoded = "0.7.1"
tracing = "0.1.44"

# SQL. sea-query pinned to the harness's stable 0.32 line (harness ADR
# 0004); `thread-safe` swaps SeaRc = Rc for Arc so query builders can live
# in async handlers.
sea-query = { version = "0.32.7", default-features = false, features = [
    "backend-sqlite",
    "thread-safe",
] }

# Time through the harness `time` stack: `wasm-bindgen` makes
# OffsetDateTime::now_utc() use JS Date on wasm32 — chrono's Utc::now and
# std::time are unusable there (ADR 0100). Modules still read the wall
# clock through the `Clock` port, never directly.
time = { version = "0.3.45", default-features = false, features = [
    "std",
    "formatting",
    "parsing",
    "wasm-bindgen",
] }

# WebAuthn (ADR 0100): wire types plus pure-Rust CBOR/COSE and signature
# crates, because upstream webauthn-rs pulls OpenSSL and cannot reach wasm32.
# These are the pins the wasm-auth spike proved on wasm32.
webauthn-rs-proto = { version = "0.5.5", default-features = false }
ciborium = { version = "0.2.2", default-features = false, features = ["std"] }
coset = { version = "0.4.2", default-features = false, features = ["std"] }
url = { version = "2.5.7", default-features = false }
# rsa 0.10 is still a release candidate, so the stable 0.9 line it is. Its
# own `sha2` re-export is used for RS256 so the digest types stay consistent
# inside rsa's tree, which pins sha2 0.10 while the workspace is on 0.11.
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
ed25519-dalek = { version = "2", default-features = false, features = [
    "alloc",
] }
rand_core = { version = "0.6", default-features = false }

# OIDC (ADR 0100 Q3): openidconnect and oauth2 build to wasm32 with default
# features off — no reqwest, no OpenSSL. These are the pins the wasm-auth
# spike validated. `chrono` comes with them as an API type; its `clock`
# feature is deliberately OFF, because `Utc::now()` panics on wasm32 and
# modules read the wall clock through the `Clock` port anyway.
openidconnect = { version = "4.0.1", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

# Traits and errors.
async-trait = "0.1.92"
thiserror = "2.0.20"

# Auth cryptography: argon2id for client secrets (ADR 0100 parameters,
# default features off — no OpenSSL, wasm32-safe, same pin as the spike);
# base64ct for cookie/secret encoding (PHC-compatible, constant-time);
# p256 for ES256 signing and JWK parsing (ADR 0100/0101 stack: `ecdsa`
# gives deterministic RFC 6979 signing, no RNG, no OpenSSL — the pin the
# wasm-auth spike validated on wasm32).
argon2 = { version = "0.6.0", default-features = false, features = [
    "alloc",
    "password-hash",
] }
base64ct = { version = "1.8.3", default-features = false, features = ["alloc"] }
p256 = { version = "0.14.0", default-features = false, features = [
    "ecdsa",
    # Apple hands out its signing key as a PKCS#8 PEM `.p8` file (#16), so
    # the minting path parses one rather than asking an operator to convert
    # a key by hand.
    "pkcs8",
    "pem",
] }
# sha2 matches the harness pin (factory0-core depends on 0.11).
sha2 = { version = "0.11.0", default-features = false }

# Enabled by wasm leaf crates (same as the harness venture example):
# getrandom (via ulid/rand through factory0-core) needs the opt-in
# wasm_js backend on wasm32-unknown-unknown.
getrandom = { version = "0.4.3", default-features = false, features = [
    "wasm_js",
] }

# Test-only.
pollster = { version = "0.4", features = ["macro"] }
tower = { version = "0.5.3", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
# Builder-heavy API: nearly every `fn(self) -> Self` and getter trips this
# lint; the attribute noise outweighs the value (same call as the harness).
must_use_candidate = { level = "allow", priority = 1 }
